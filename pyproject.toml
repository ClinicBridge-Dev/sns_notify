[project]
name = "local-whatsapp"
version = "0.1.0"
description = "WhatsApp local collector + read-only chat viewer"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sse-starlette>=2.1",
  "slack-sdk>=3.33",
  "openai>=1.50",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "itsdangerous>=2.2",
  "pyobjc-framework-ApplicationServices>=10.3; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
